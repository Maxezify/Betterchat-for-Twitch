# Filet de sécurité côté GitHub : le même banc que le hook pre-commit, sur chaque push et
# chaque pull request vers dev ou prod (un commit fait avec --no-verify y passe aussi).
name: Banc de test

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  banc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Banc sur la source commentée
        run: npm test -- --json tests/resultats/ci.json
      - name: Construction et banc de la version optimisée
        run: npm run test:build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: resultats-banc
          path: tests/resultats/
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: version-optimisee
          path: dist/BetterTwitchChat.user.js
