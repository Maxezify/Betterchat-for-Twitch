# Filet de sécurité côté GitHub : le même banc que le hook pre-commit, sur chaque push et
# chaque pull request vers dev ou prod (un commit fait avec --no-verify y passe aussi).
name: Banc de test

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  banc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --json tests/resultats/ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-banc
          path: tests/resultats/
